<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8fd6" />
      <stop offset="100%" stop-color="#8e3b8e" />
    </linearGradient>
    <radialGradient id="gA"><stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" /><stop offset="100%" stop-color="#ffffff" stop-opacity="0" /></radialGradient>
    <radialGradient id="gB"><stop offset="0%" stop-color="#000000" stop-opacity="0.1" /><stop offset="100%" stop-color="#000000" stop-opacity="0" /></radialGradient>
    
    <filter id="softBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <radialGradient id="highlight" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="420" cy="349" r="297" fill="url(#gA)" opacity="0.55" /><circle cx="33" cy="127" r="296" fill="url(#gB)" opacity="0.55" /><circle cx="537" cy="481" r="355" fill="url(#gA)" opacity="0.55" /><circle cx="384" cy="379" r="268" fill="url(#gB)" opacity="0.55" />
  <circle cx="300" cy="285" r="260" fill="url(#highlight)" />
  <ellipse cx="300" cy="485" rx="150" ry="28" fill="#000000" opacity="0.25" filter="url(#softBlur)" />
  <text x="50%" y="50%" font-size="340" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">🥤</text>
</svg>