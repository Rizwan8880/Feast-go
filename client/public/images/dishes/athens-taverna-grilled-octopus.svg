  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="405" cy="216" r="283" fill="url(#gA)" opacity="0.55" /><circle cx="5" cy="521" r="251" fill="url(#gB)" opacity="0.55" /><circle cx="207" cy="563" r="266" fill="url(#gA)" opacity="0.55" /><circle cx="359" cy="558" r="267" fill="url(#gB)" opacity="0.55" />
  <circle cx="300" cy="285" r="260" fill="url(#highlight)" />
  <ellipse cx="300" cy="485" rx="150" ry="28" fill="#000000" opacity="0.25" filter="url(#softBlur)" />
