    <radialGradient id="highlight" cx="38%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <circle cx="271" cy="535" r="228" fill="url(#gA)" opacity="0.55" /><circle cx="554" cy="287" r="285" fill="url(#gB)" opacity="0.55" /><circle cx="238" cy="387" r="262" fill="url(#gA)" opacity="0.55" /><circle cx="395" cy="465" r="352" fill="url(#gB)" opacity="0.55" />
  <circle cx="300" cy="285" r="260" fill="url(#highlight)" />
  <ellipse cx="300" cy="485" rx="150" ry="28" fill="#000000" opacity="0.25" filter="url(#softBlur)" />
  <text x="50%" y="50%" font-size="340" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI Emoji, Apple Color Emoji, sans-serif">🍢</text>
