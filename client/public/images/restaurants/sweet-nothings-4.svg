  <rect width="800" height="480" fill="url(#bg)" />
  <circle cx="522" cy="92" r="252" fill="url(#gA)" opacity="0.55" /><circle cx="374" cy="146" r="427" fill="url(#gB)" opacity="0.55" /><circle cx="581" cy="28" r="469" fill="url(#gA)" opacity="0.55" /><circle cx="81" cy="194" r="388" fill="url(#gB)" opacity="0.55" />
  <circle cx="400" cy="230" r="220" fill="url(#highlight)" />
